name: Update data and deploy site

on:
  schedule:
    - cron: "30 0 * * *"      # daily ~00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

env:
  # sha256 of pipeline/frozen/FROZEN_SHA256SUMS (the list of every v2 and v3 frozen file, timestamped 2026-10-25)
  FROZEN_LIST_SHA256: 96f83fc4e0e34d1e0efaf0a097f35e2b323dc0edb4e80d8b692f63b3f0031234
  # sha256 of pipeline/frozen/band/BAND_SHA256SUMS (blue band pre-registration, PREREG_BAND.md). Set on the freeze day.
  BAND_LIST_SHA256: 0ad5244cacdf0a3d21a8d7fe3506f028ceb1ef434f32f9bf377c4ae107cd427b

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - v2 and v3 frozen files must not change
        run: |
          echo "$FROZEN_LIST_SHA256  pipeline/frozen/FROZEN_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/FROZEN_SHA256SUMS
          (cd pipeline/frozen/v3 && sha256sum -c v3_hashes.txt)
      - name: Guard - band pre-registration files must not change
        run: |
          echo "$BAND_LIST_SHA256  pipeline/frozen/band/BAND_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/band/BAND_SHA256SUMS

  update:
    needs: guard
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - run: pip install -r requirements.txt
      # Yahoo Finance, Deribit and OKX raw files may not be republished, so they are not in git. The runner keeps
      # them between runs in the Actions cache; on a cache miss update.sh simply fetches them fresh.
      - name: Restore private raw data (not published)
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache/yahoo_btc.json
            pipeline/cache/yahoo_mstr.json
            pipeline/cache/crowd_deribit.json
            pipeline/cache/crowd_okx.json
            pipeline/cache/crowd_bitmex.json
          key: raw-private-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-private-
      - name: Rebuild data (failure-tolerant; keeps last data on source errors)
        run: bash scripts/update.sh
      - name: Guard - v2, v3 and band frozen files must not change during the run
        run: |
          git diff --exit-code -- pipeline/frozen pipeline/v2_spec.py pipeline/robust.py
          echo "$FROZEN_LIST_SHA256  pipeline/frozen/FROZEN_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/FROZEN_SHA256SUMS
          echo "$BAND_LIST_SHA256  pipeline/frozen/band/BAND_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/band/BAND_SHA256SUMS
      - name: Guard - append-only records (band logs, price log, hash chain, scorecard) keep every earlier row
        run: python scripts/check_append_only.py HEAD
      - name: Save the dated raw-data snapshot (daily small files, weekly large files; failure-tolerant)
        run: bash scripts/snapshot.sh || echo "::warning::snapshot failed"
      - name: Save private raw data for the next run (not published)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            pipeline/cache/yahoo_btc.json
            pipeline/cache/yahoo_mstr.json
            pipeline/cache/crowd_deribit.json
            pipeline/cache/crowd_okx.json
            pipeline/cache/crowd_bitmex.json
          key: raw-private-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Daily hash-chain record + OpenTimestamps stamp (never fails the run; a missed stamp is retried next day)
        run: |
          pip install -q opentimestamps-client==0.7.2 || true
          python scripts/stamp_daily.py || true
      - name: Upgrade the OpenTimestamps proofs once Bitcoin confirms them (failure-tolerant)
        run: |
          for f in pipeline/timestamps/*.ots pipeline/timestamps/chain/*.ots pipeline/frozen/band/*.ots; do
            [ -e "$f" ] || continue
            ots upgrade "$f" || echo "::notice::$f not upgraded yet (still pending or calendar unreachable)"
          done
          rm -f pipeline/timestamps/*.ots.bak pipeline/timestamps/chain/*.ots.bak pipeline/frozen/band/*.ots.bak
      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data hero_combined.png pipeline/out pipeline/cache pipeline/timestamps snapshots pipeline/frozen/band/*.ots
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Daily data refresh $(date -u +%F)" && git push; fi

  deploy:
    needs: [guard, update]
    if: always() && needs.guard.result == 'success' && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html favicon.svg og-image.png .nojekyll css js data hero_combined.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
