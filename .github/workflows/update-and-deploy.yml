name: Update data and deploy site

on:
  schedule:
    - cron: "30 0 * * *"      # daily ~00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild data (failure-tolerant; keeps last data on source errors)
        run: bash scripts/update.sh
      - name: Guard - frozen spec files must not change
        run: |
          git diff --exit-code -- pipeline/frozen pipeline/v2_spec.py pipeline/robust.py pipeline/v3/v3_spec.md pipeline/v3/v3_hashes.txt
          sha256sum pipeline/v2_spec.py pipeline/robust.py pipeline/frozen/fan_2026-10-25.json
      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data hero_combined.png pipeline/out pipeline/cache
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Daily data refresh $(date -u +%F)" && git push; fi

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html favicon.svg .nojekyll css js data hero_combined.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
