name: Update data and deploy site

on:
  schedule:
    - cron: "30 0 * * *"      # daily ~00:30 UTC: full site refresh; scorecard rows only if CoinMetrics has the whole day
    # Retries (scripts/score_gate.py): each one exits at once, with no commit, if yesterday's scorecard rows and today's
    # daily record already exist. From 12:00 UTC the rows are written even with missing on-chain fields, with a public note.
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"      # deadline
    - cron: "0 18 * * *"      # backstop in case GitHub drops a scheduled run
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Refresh the site even if today's scorecard rows and daily record already exist (never writes them twice)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

env:
  # sha256 of pipeline/frozen/FROZEN_SHA256SUMS (the list of every v2 and v3 frozen file, timestamped 2026-10-25)
  FROZEN_LIST_SHA256: 96f83fc4e0e34d1e0efaf0a097f35e2b323dc0edb4e80d8b692f63b3f0031234
  # sha256 of pipeline/frozen/band/BAND_SHA256SUMS (blue band pre-registration, PREREG_BAND.md). Set on the freeze day.
  BAND_LIST_SHA256: 0ad5244cacdf0a3d21a8d7fe3506f028ceb1ef434f32f9bf377c4ae107cd427b
  # sha256 of pipeline/candidates/CANDIDATES_SHA256SUMS (shadow candidates pre-registration, 2026-10-26). Research only: a
  # mismatch fails its own job and skips the shadow log, but never blocks the official update, scorecard or daily record.
  CANDIDATES_LIST_SHA256: f84d7d632310be8edb6895fb4e3ebff6b6470d590dccbfffa23404d4bfb5b16c

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - v2 and v3 frozen files must not change
        run: |
          echo "$FROZEN_LIST_SHA256  pipeline/frozen/FROZEN_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/FROZEN_SHA256SUMS
          (cd pipeline/frozen/v3 && sha256sum -c v3_hashes.txt)
      - name: Guard - band pre-registration files must not change
        run: |
          echo "$BAND_LIST_SHA256  pipeline/frozen/band/BAND_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/band/BAND_SHA256SUMS

  guard-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - shadow candidates pre-registration must not change (separate job; does not gate the update)
        run: |
          echo "$CANDIDATES_LIST_SHA256  pipeline/candidates/CANDIDATES_SHA256SUMS" | sha256sum -c
          cd pipeline/candidates && sha256sum -c CANDIDATES_SHA256SUMS

  check:
    needs: guard
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.c.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
      - name: Anything left to do today? (00:30 UTC run and full_refresh always run; retries only if rows or record are missing)
        id: c
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FULL: ${{ inputs.full_refresh }}
        run: |
          if [ "$SCHEDULE" = "30 0 * * *" ] || [ "$FULL" = "true" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"
          else python3 scripts/score_gate.py needed >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"

  update:
    needs: [guard, check]
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - run: pip install -r requirements.txt
      # Yahoo Finance, Deribit and OKX raw files (crowd gauge and shadow candidates) may not be republished, so they are not in git. The runner keeps
      # them between runs in the Actions cache; on a cache miss update.sh simply fetches them fresh.
      - name: Restore private raw data (not published)
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache/yahoo_btc.json
            pipeline/cache/yahoo_mstr.json
            pipeline/cache/crowd_deribit.json
            pipeline/cache/crowd_okx.json
            pipeline/cache/crowd_bitmex.json
            pipeline/cache/candidates/okx_oi.json
            pipeline/cache/candidates/deribit_oi.json
          key: raw-private-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: raw-private-
      - name: Rebuild data (failure-tolerant; keeps last data on source errors)
        run: bash scripts/update.sh
      - name: Guard - v2, v3 and band frozen files must not change during the run
        run: |
          git diff --exit-code -- pipeline/frozen pipeline/v2_spec.py pipeline/robust.py
          echo "$FROZEN_LIST_SHA256  pipeline/frozen/FROZEN_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/FROZEN_SHA256SUMS
          echo "$BAND_LIST_SHA256  pipeline/frozen/band/BAND_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/band/BAND_SHA256SUMS
      - name: Guard - append-only records (band logs, price log, hash chain, scorecard) keep every earlier row
        run: python scripts/check_append_only.py HEAD
      # The day's snapshot and hash-chain record wait until yesterday's scorecard rows are written (or 12:00 UTC has passed),
      # so the record covers them; scripts/score_gate.py settled. Both stay one per UTC day and are never rewritten.
      - name: Ready to write today's snapshot and daily record?
        id: settled
        run: |
          if python scripts/score_gate.py settled; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: Save the dated raw-data snapshot (daily small files, weekly large files; failure-tolerant)
        if: steps.settled.outputs.ok == 'true'
        run: bash scripts/snapshot.sh || echo "::warning::snapshot failed"
      - name: Save private raw data for the next run (not published)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            pipeline/cache/yahoo_btc.json
            pipeline/cache/yahoo_mstr.json
            pipeline/cache/crowd_deribit.json
            pipeline/cache/crowd_okx.json
            pipeline/cache/crowd_bitmex.json
            pipeline/cache/candidates/okx_oi.json
            pipeline/cache/candidates/deribit_oi.json
          key: raw-private-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Daily hash-chain record + OpenTimestamps stamp (never fails the run; a missed stamp is retried next day)
        if: steps.settled.outputs.ok == 'true'
        run: |
          pip install -q opentimestamps-client==0.7.2 || true
          python scripts/stamp_daily.py || true
      - name: Shadow candidates hash-chain record + OpenTimestamps stamp (separate chain; never fails the run)
        if: steps.settled.outputs.ok == 'true'
        run: python scripts/stamp_candidates.py || true
      - name: Upgrade the OpenTimestamps proofs once Bitcoin confirms them (failure-tolerant)
        run: |
          for f in pipeline/timestamps/*.ots pipeline/timestamps/chain/*.ots pipeline/timestamps/candidates/*.ots pipeline/frozen/band/*.ots pipeline/candidates/*.ots; do
            [ -e "$f" ] || continue
            ots upgrade "$f" || echo "::notice::$f not upgraded yet (still pending or calendar unreachable)"
          done
          rm -f pipeline/timestamps/*.ots.bak pipeline/timestamps/chain/*.ots.bak pipeline/timestamps/candidates/*.ots.bak pipeline/frozen/band/*.ots.bak pipeline/candidates/*.ots.bak
      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data hero_combined.png pipeline/out pipeline/cache pipeline/timestamps snapshots pipeline/frozen/band/*.ots pipeline/candidates/*.ots
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Daily data refresh $(date -u +%F)" && git push; fi

  deploy:
    needs: [guard, check, update]
    # push: deploy the committed site; scheduled/dispatch: deploy only if the update job ran (a no-op retry deploys nothing)
    if: always() && needs.guard.result == 'success' && ((github.event_name == 'push' && needs.update.result == 'skipped') || needs.update.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html favicon.svg og-image.png .nojekyll css js data hero_combined.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
