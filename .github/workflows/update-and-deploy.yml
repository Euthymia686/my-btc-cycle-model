name: Update data and deploy site

on:
  schedule:
    - cron: "30 0 * * *"      # daily ~00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

env:
  # sha256 of pipeline/frozen/FROZEN_SHA256SUMS (the list of every v2 and v3 frozen file, timestamped 2026-10-25)
  FROZEN_LIST_SHA256: 591f2ccae6bd3575694bf2e7e28cc4d73bea67f970fdb739de6b401f0578a565

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - v2 and v3 frozen files must not change
        run: |
          echo "$FROZEN_LIST_SHA256  pipeline/frozen/FROZEN_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/FROZEN_SHA256SUMS
          (cd pipeline/frozen/v3 && sha256sum -c v3_hashes.txt)

  update:
    needs: guard
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild data (failure-tolerant; keeps last data on source errors)
        run: bash scripts/update.sh
      - name: Guard - v2 and v3 frozen files must not change during the run
        run: |
          git diff --exit-code -- pipeline/frozen pipeline/v2_spec.py pipeline/robust.py
          echo "$FROZEN_LIST_SHA256  pipeline/frozen/FROZEN_SHA256SUMS" | sha256sum -c
          sha256sum -c pipeline/frozen/FROZEN_SHA256SUMS
      - name: Save the dated raw-data snapshot (daily small files, weekly large files; failure-tolerant)
        run: bash scripts/snapshot.sh || echo "::warning::snapshot failed"
      - name: Upgrade the OpenTimestamps proof once Bitcoin confirms it (failure-tolerant)
        run: |
          pip install -q opentimestamps-client==0.7.2 || true
          for f in pipeline/timestamps/*.ots; do ots upgrade "$f" || echo "::notice::$f not upgraded yet (still pending or calendar unreachable)"; done
          rm -f pipeline/timestamps/*.ots.bak
      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data hero_combined.png pipeline/out pipeline/cache pipeline/timestamps snapshots
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "Daily data refresh $(date -u +%F)" && git push; fi

  deploy:
    needs: [guard, update]
    if: always() && needs.guard.result == 'success' && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html favicon.svg .nojekyll css js data hero_combined.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
